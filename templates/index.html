<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>J.R.D. Public School - Portal Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0c0c0d;
      --bg-card: #141517;
      --bg-input: #000000;
      --border-color: #383a3e;
      --text-main: #ffffff;
      --orange-main: #ff6e00;
      --orange-glow: 0 0 20px rgba(255, 110, 0, 0.6);
      --blue-main: #00d2ff;
      --blue-glow: 0 0 20px rgba(0, 210, 255, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* 🔄 1. JRD SPIN LOADER CSS - यह डिफ़ॉल्ट रूप से छिपा रहेगा (display: none) */
    #loader {
      display: none; 
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(12, 12, 13, 0.95);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }

    /* गोल-गोल घूमने वाला चक्र */
    .jrd-spin {
      width: 140px;
      height: 140px;
      border: 4px solid #2e2f31;
      border-top: 4px solid var(--orange-main);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      line-height: 18px;
      animation: spin 1.2s linear infinite;
      box-shadow: var(--orange-glow);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 🛡️ अंदर लिखे टेक्स्ट को उल्टा घूमने से रोकने के लिए ताकि वो सीधा दिखे */
    .loader-text-inside {
      animation: anti-spin 1.2s linear infinite;
    }
    @keyframes anti-spin {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    .login-container {
      max-width: 400px;
      width: 100%;
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 24px;
      padding: 35px 25px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      text-align: center;
    }

    .login-container.teacher-mode { border-color: var(--blue-main); }
    .school-logo { font-size: 45px; color: var(--orange-main); margin-bottom: 15px; text-shadow: var(--orange-glow); }
    .login-container.teacher-mode .school-logo { color: var(--blue-main); text-shadow: var(--blue-glow); }
    .login-container h2 { font-size: 22px; font-weight: 600; margin-bottom: 5px; }
    .portal-title { font-size: 14px; color: var(--orange-main); font-weight: bold; margin-bottom: 25px; }
    .login-container.teacher-mode .portal-title { color: var(--blue-main); }

    .input-group { position: relative; margin-bottom: 20px; text-align: left; }
    .input-group i { position: absolute; left: 15px; top: 15px; color: #62656a; font-size: 16px; }
    .input-group input {
      width: 100%; padding: 14px 15px 14px 45px; background: var(--bg-input);
      border: 1px solid var(--border-color); border-radius: 12px; color: #fff;
      font-size: 15px; font-weight: 600; outline: none;
    }
    .input-group input:focus { border-color: var(--orange-main); }
    .login-container.teacher-mode .input-group input:focus { border-color: var(--blue-main); }

    .login-btn {
      width: 100%; background: linear-gradient(135deg, var(--orange-main), #ff8c3a);
      color: #fff; border: none; padding: 14px; border-radius: 12px;
      font-size: 16px; font-weight: 700; cursor: pointer; text-transform: uppercase;
      margin-top: 10px; box-shadow: 0 4px 15px rgba(255,110,0,0.3);
    }
    .login-container.teacher-mode .login-btn { background: linear-gradient(135deg, var(--blue-main), #008ca7); }
    .switch-link { margin-top: 25px; font-size: 13px; color: #aaa; }
    .switch-link a { color: var(--orange-main); font-weight: bold; cursor: pointer; text-decoration: none; }
    .login-container.teacher-mode .switch-link a { color: var(--blue-main); }
  </style>
</head>
<body>

<div id="loader">
  <div class="jrd-spin">
    <div class="loader-text-inside">
      J.R.D.PUBLIC SCHOOL<br><span style="font-size:9px; color:var(--orange-main);" id="loaderSubText">PROCESSING</span>
    </div>
  </div>
</div>

<div class="login-container" id="loginCard">
  <div class="school-logo"><i class="fa-solid fa-graduation-cap"></i></div>
  <h2>J.R.D. PUBLIC SCHOOL</h2>
  <div class="portal-title" id="portalTitle">🔒 डिजिटल एडमिनिस्ट्रेशन पैनल</div>

  <form onsubmit="event.preventDefault(); handleLoginSubmit();">
    <div class="input-group">
      <i class="fa-solid fa-user"></i>
      <input type="text" id="userInput" placeholder="एडमिन यूज़र आईडी दर्ज करें..." required>
    </div>
    <div class="input-group">
      <i class="fa-solid fa-lock"></i>
      <input type="password" id="keyInput" placeholder="सुरक्षा पिन / पासवर्ड दर्ज करें..." required>
    </div>
    <button type="submit" class="login-btn" id="submitBtn">एडमिन लॉगिन ➔</button>
  </form>

  <div class="switch-link" id="switchBox">
    क्या आप शिक्षक हैं? <a onclick="toggleMode('teacher')">शिक्षक स्मार्ट पोर्टल यहाँ खोलें ➔</a>
  </div>
</div>

<script>
  let currentMode = 'admin';

  function toggleMode(mode) {
    currentMode = mode;
    const card = document.getElementById("loginCard");
    const title = document.getElementById("portalTitle");
    const userInp = document.getElementById("userInput");
    const keyInp = document.getElementById("keyInput");
    const btn = document.getElementById("submitBtn");
    const switchBox = document.getElementById("switchBox");
    const spinRing = document.querySelector(".jrd-spin");
    const subText = document.getElementById("loaderSubText");

    if (mode === 'teacher') {
      card.classList.add("teacher-mode");
      title.innerHTML = "📝 शिक्षक स्मार्ट पोर्टल";
      userInp.placeholder = "शिक्षक यूज़र आईडी दर्ज करें...";
      keyInp.placeholder = "शिक्षक पासवर्ड दर्ज करें...";
      btn.innerHTML = "शिक्षक लॉगिन ➔";
      switchBox.innerHTML = "मैनेजमेंट लॉगिन पर जाएँ? <a onclick=\"toggleMode('admin')\">एडमिन पोर्टल यहाँ खोलें ➔</a>";
      spinRing.style.borderTopColor = "var(--blue-main)";
      subText.style.color = "var(--blue-main)";
    } else {
      card.classList.remove("teacher-mode");
      title.innerHTML = "🔒 डिजिटल एडमिनिस्ट्रेशन पैनल";
      userInp.placeholder = "एडमिन यूज़र आईडी दर्ज करें...";
      keyInp.placeholder = "सुरक्षा पिन / पासवर्ड दर्ज करें...";
      btn.innerHTML = "एडमिन लॉगिन ➔";
      switchBox.innerHTML = "क्या आप शिक्षक हैं? <a onclick=\"toggleMode('teacher')\">शिक्षक स्मार्ट पोर्टल यहाँ खोलें ➔</a>";
      spinRing.style.borderTopColor = "var(--orange-main)";
      subText.style.color = "var(--orange-main)";
    }
    userInp.value = ""; keyInp.value = "";
  }

  function handleLoginSubmit() {
    const userVal = document.getElementById("userInput").value.trim();
    const keyVal = document.getElementById("keyInput").value.trim();
    
    // 🚀 बटन दबाते ही जे.आर.डी. स्पिनर स्क्रीन पर आ जाएगा
    document.getElementById("loader").style.display = "flex";
    
    if (currentMode === 'admin') {
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.success) {
            window.top.location.href = response.targetUrl;
          } else {
            document.getElementById("loader").style.display = "none"; // गलत पासवर्ड पर लोडर हटेगा
            alert(response.msg);
          }
        })
        .withFailureHandler(function(err) {
          document.getElementById("loader").style.display = "none";
          alert("सर्वर एरर: " + err.toString());
        })
        .verifyTwoLayerLogin(userVal, keyVal);
    } else {
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.success) {
            window.top.location.href = response.targetUrl;
          } else {
            document.getElementById("loader").style.display = "none";
            alert(response.msg);
          }
        })
        .withFailureHandler(function(err) {
          document.getElementById("loader").style.display = "none";
          alert("सर्वर एरर: " + err.toString());
        })
        .verifyTeacherLogin(userVal, keyVal);
    }
  }
</script>

</body>
</html>
