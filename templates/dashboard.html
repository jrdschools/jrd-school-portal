<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.R.D. Public School | Gemini Charcoal ERP</title>
    <style>
        :root {
            --bg-main: #121214;          /* गहरा चारकोल बैकग्राउंड */
            --bg-card: #1a1a1e;          /* कार्ड्स का डार्क ग्रे */
            --bg-input: #26262b;         /* इनपुट बॉक्स */
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --gemini-blue: #3b82f6;      /* जेमिनी लाइट ब्लू */
            --accent-green: #10b981;     /* PRESENT (P) */
            --accent-red: #ef4444;       /* ABSENT (A) */
            --accent-warning: #f59e0b;   /* LEAVE (L) */
            --sidebar-width: 65px;       
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; overflow-x: hidden; display: flex; }
        
        /* ☰ जेमिनी स्टाइल साइडबार ☰ */
        .gemini-sidebar {
            position: fixed; top: 0; left: 0; height: 100vh;
            width: var(--sidebar-width); background: #1a1a1e;
            border-right: 1px solid #252529; z-index: 200;
            display: flex; flex-direction: column; gap: 15px;
            padding-top: 15px; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        .gemini-sidebar.expanded { width: 240px; box-shadow: 10px 0 30px rgba(0,0,0,0.5); }

        .menu-toggle {
            width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: var(--text-main); cursor: pointer; margin-left: 10px;
            border-radius: 50%; transition: background 0.2s;
        }
        .menu-toggle:hover { background: var(--bg-input); }

        .nav-item {
            display: flex; align-items: center; width: 220px; height: 48px;
            margin-left: 8px; border-radius: 24px; color: var(--text-muted);
            cursor: pointer; transition: all 0.2s ease; position: relative;
            padding-left: 12px; gap: 20px;
        }
        .nav-item .icon { font-size: 20px; min-width: 30px; text-align: center; }
        .nav-item .text { font-size: 14px; white-space: nowrap; opacity: 0; transition: opacity 0.2s; font-weight: 500; }
        .gemini-sidebar.expanded .nav-item .text { opacity: 1; }
        
        .nav-item.active { background: #232329; color: var(--gemini-blue); font-weight: bold; }
        .nav-item.active::before {
            content: ''; position: absolute; left: -8px; top: 12px; width: 4px; height: 24px;
            background: var(--gemini-blue); border-radius: 0 4px 4px 0;
        }

        /* मुख्य ऐप एरिया */
        .app-main {
            flex: 1; margin-left: var(--sidebar-width);
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; min-height: 100vh;
        }
        @media (min-width: 768px) {
            body.sidebar-open .app-main { margin-left: 240px; }
        }

        .app-header {
            background: #1a1a1e; border-bottom: 1px solid #252529; padding: 15px 25px;
            display: flex; justify-content: space-between; align-items: center; height: 65px;
        }
        .app-header h1 { font-size: 16px; font-weight: 600; color: var(--gemini-blue); }
        
        .app-container { padding: 20px; flex: 1; max-width: 900px; width: 100%; margin: 0 auto; }
        .app-screen { display: none; animation: fadeIn 0.3s ease; }
        .app-screen.active { display: block; }

        /* प्रीमियम कार्ड्स और बटन्स */
        .card { background: var(--bg-card); padding: 22px; border-radius: 12px; border: 1px solid #252529; box-shadow: 0 4px 15px rgba(0,0,0,0.2); margin-bottom: 20px; }
        .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 15px; color: #fff; text-transform: uppercase; }

        select, input { width: 100%; padding: 12px; margin-bottom: 12px; background-color: var(--bg-input); border: 1px solid #33333b; border-radius: 8px; color: var(--text-main); font-size: 14px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; text-transform: uppercase; }
        .btn-gemini { background: var(--gemini-blue); color: white; }
        .btn-success { background-color: var(--accent-green); color: white; }

        /* 👥 छात्र हाजिरी लिस्ट का असली रो लेआउट */
        .attendance-list-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #232329; }
        .student-details h4 { font-size: 15px; color: #fff; text-transform: uppercase; font-weight: 700; }
        .student-details p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        
        /* 🕹️ बड़े बोल्ड P / A / L बटन्स */
        .pal-buttons { display: flex; gap: 6px; }
        .pal-btn { width: 42px; height: 38px; border: 1px solid #33333b; border-radius: 6px; cursor: pointer; font-weight: 900; background: var(--bg-input); color: var(--text-muted); font-size: 14px; }
        .pal-btn.p.active { background: var(--accent-green); color: white; border-color: var(--accent-green); box-shadow: 0 0 10px rgba(16,185,129,0.4); }
        .pal-btn.a.active { background: var(--accent-red); color: white; border-color: var(--accent-red); box-shadow: 0 0 10px rgba(239,68,68,0.4); }
        .pal-btn.l.active { background: var(--accent-warning); color: black; border-color: var(--accent-warning); box-shadow: 0 0 10px rgba(245,158,11,0.4); }

        #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; color: var(--gemini-blue); font-weight: 900; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="loader">JRD QUANTUM ENGINE SYNC...</div>

    <!-- ☰ साइडबार ☰ -->
    <div class="gemini-sidebar" id="sidebar">
        <div class="menu-toggle" onclick="toggleSidebar()">☰</div>
        <div class="nav-item active" onclick="switchTab(this, 'scr-student')"><span class="icon">👥</span><span class="text">छात्र हाजिरी</span></div>
        <div class="nav-item" onclick="switchTab(this, 'scr-admin')"><span class="icon">👑</span><span class="text">डायरेक्टर पैनल</span></div>
    </div>

    <div class="app-main">
        <div class="app-header">
            <h1 id="portalTitle">J.R.D. Public School ERP</h1>
            <div id="welcomeUser" style="font-size: 13px; color: var(--text-muted); font-weight: 600;">Loading...</div>
        </div>

        <div class="app-container">
            <!-- स्क्रीन 1: छात्र हाजिरी (टीचर्स और एडमिन दोनों देख सकेंगे) -->
            <div id="scr-student" class="app-screen active">
                <div class="card">
                    <h2>👥 Student Attendance Sheet</h2>
                    <div id="studentAttendanceList">
                        <!-- असली छात्र यहाँ लोड होंगे -->
                    </div>
                    <button class="btn btn-success" style="margin-top:20px;" onclick="saveBulkAttendance()">💾 Save Attendance Live</button>
                </div>
            </div>

            <!-- स्क्रीन 2: डायरेक्टर स्पेशल पैनल (सिर्फ आपके लॉगिन पर दिखेगा) -->
            <div id="scr-admin" class="app-screen">
                <div class="card">
                    <h2>👑 Director Control Center (Sarvesh Bhai)</h2>
                    <p style="margin-bottom: 15px; color: var(--accent-green);">● SYSTEM PULSE V71 LIVE</p>
                    <button class="btn btn-gemini" onclick="alert('डेली रिलीज छुट्टी सिग्नल बोट को प्रेषित!')">📢 TRIGGER DEPARTURE SMS (ALL CLASSES)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let sessionUser = null;
        let studentsData = [];

        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("expanded");
            document.body.classList.toggle("sidebar-open");
        }

        function switchTab(navElement, screenId) {
            if (screenId === 'scr-admin' && sessionUser.role !== 'DIRECTOR') {
                alert("🔒 एक्सेस ब्लॉक: यह सिर्फ सरवेश भाई (Director) के लिए है!");
                return;
            }
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.querySelectorAll('.app-screen').forEach(screen => screen.classList.remove('active'));
            navElement.classList.add('active');
            document.getElementById(screenId).classList.add('active');
            if(window.innerWidth < 768) toggleSidebar();
        }

        // 📡 रेंडर बैकएंड से असली यूज़र और क्लास डेटा खींचना
        async function loadDashboard() {
            document.getElementById('loader').style.display = 'flex';
            try {
                const res = await fetch('/get_session_info');
                const data = await res.json();
                document.getElementById('loader').style.display = 'none';

                if (data.status === 'success') {
                    sessionUser = data;
                    document.getElementById('welcomeUser').innerText = data.name + ` (${data.assigned_class})`;
                    loadStudents();
                } else {
                    window.location.href = '/';
                }
            } catch(e) { window.location.href = '/'; }
        }

        // 👥 असली गूगल शीट से छात्रों की लिस्ट P, A, L बटन्स के साथ लोड करना
        async function loadStudents() {
            try {
                const res = await fetch(`/get_students?class=${encodeURIComponent(sessionUser.assigned_class)}`);
                const data = await res.json();
                
                if (data.status === 'success') {
                    studentsData = data.students;
                    const listDiv = document.getElementById('studentAttendanceList');
                    listDiv.innerHTML = "";

                    studentsData.forEach((student, index) => {
                        const isP = student.status === 'PRESENT';
                        const isA = student.status === 'ABSENT';
                        const isL = student.status === 'LEAVE';

                        const row = document.createElement('div');
                        row.className = 'attendance-list-row';
                        row.innerHTML = `
                            <div class="student-details">
                                <h4>${student.student_name}</h4>
                                <p>Father: ${student.father_name} | Mob: ${student.mobile}</p>
                            </div>
                            <div class="pal-buttons">
                                <button class="pal-btn p ${isP?'active':''}" onclick="changeStatus(${index}, 'PRESENT', this)">P</button>
                                <button class="pal-btn a ${isA?'active':''}" onclick="changeStatus(${index}, 'ABSENT', this)">A</button>
                                <button class="pal-btn l ${isL?'active':''}" onclick="changeStatus(${index}, 'LEAVE', this)">L</button>
                            </div>
                        `;
                        listDiv.appendChild(row);
                    });
                }
            } catch(e) { alert("गूगल शीट सिंक फेल!"); }
        }

        function changeStatus(index, status, btn) {
            studentsData[index].status = status;
            const parent = btn.parentElement;
            parent.querySelectorAll('.pal-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // 💾 सेव दबाते ही रेंडर पाइथन के ज़रिए गूगल शीट में लाइव ओवरराइट लॉक
        async function saveBulkAttendance() {
            document.getElementById('loader').style.display = 'flex';
            try {
                const res = await fetch('/save_student_attendance', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ records: studentsData })
                });
                const data = await res.json();
                document.getElementById('loader').style.display = 'none';
                alert(data.message); // "डेटा लाइव गूगल शीट में ओवरराइड होकर सुरक्षित सेव हो गया है!"
                loadStudents();
            } catch(e) { document.getElementById('loader').style.display = 'none'; alert("सेव फेल हुआ!"); }
        }

        window.onload = loadDashboard;
    </script>
</body>
</html>
