<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>J.R.D. Public School - Super Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0c0c0d;
      --bg-card: #141517;
      --bg-input: #000000;
      --border-color: #383a3e;
      --text-main: #ffffff;
      --text-muted: #8a8d93;
      --blue-main: #00d2ff;
      --blue-glow: 0 0 20px rgba(0, 210, 255, 0.4);
      --orange-main: #ff6e00;
      --orange-glow: 0 0 20px rgba(255, 110, 0, 0.4);
      --green-main: #00e676;
      --red-main: #ff1744;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 15px; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); border: 1px solid var(--border-color); padding: 15px 20px; border-radius: 16px; margin-bottom: 20px; }
    .user-info h3 { font-size: 16px; color: #fff; }
    .user-info p { font-size: 12px; color: var(--blue-main); font-weight: 600; }
    .logout-btn { background: none; border: none; color: var(--red-main); font-size: 18px; cursor: pointer; }

    .admin-section { display: none; margin-bottom: 25px; }
    .section-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; color: var(--orange-main); }
    
    .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 15px; }
    .card.admin-border { border-color: var(--orange-main); box-shadow: var(--orange-glow); }
    
    .teacher-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 10px; cursor: pointer; }
    .teacher-meta h4 { font-size: 14px; color: #fff; }
    .teacher-meta p { font-size: 11px; color: var(--text-muted); }

    .leave-item { background: var(--bg-input); border: 1px solid var(--border-color); padding: 12px; border-radius: 12px; margin-bottom: 10px; }
    .leave-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .leave-reason { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
    .leave-actions { display: flex; gap: 10px; }
    .action-btn { flex: 1; padding: 6px; border: none; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; color: #fff; }
    .btn-approve { background: var(--green-main); }
    .btn-reject { background: var(--red-main); }

    .class-selector { width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 12px; color: #fff; font-size: 14px; font-weight: 600; margin-bottom: 20px; outline: none; }

    .teacher-section { display: none; }
    .student-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); border: 1px solid var(--border-color); padding: 15px; border-radius: 16px; margin-bottom: 10px; }
    .student-info h4 { font-size: 14px; color: #fff; }
    .student-info p { font-size: 11px; color: var(--text-muted); }

    .status-group { display: flex; gap: 8px; }
    .status-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--border-color); background: var(--bg-input); color: var(--text-muted); font-weight: 700; font-size: 14px; cursor: pointer; }
    .status-btn.present.active { background: var(--green-main); color: #000; border-color: var(--green-main); box-shadow: 0 0 10px rgba(0,230,118,0.4); }
    .status-btn.absent.active { background: var(--red-main); color: #fff; border-color: var(--red-main); box-shadow: 0 0 10px rgba(255,23,68,0.4); }

    .save-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bg-card); border-top: 1px solid var(--border-color); padding: 15px; text-align: center; }
    .main-save-btn { width: 100%; max-width: 400px; padding: 14px; background: linear-gradient(135deg, var(--blue-main), #008ca7); border: none; border-radius: 12px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
  </style>
</head>
<body>

  <!-- 📱 टॉप नेविगेशन बार -->
  <div class="top-bar">
    <div class="user-info">
      <h3 id="profileName">लोड हो रहा है...</h3>
      <p id="profileRole">⚡ रोल: चेकिंग</p>
    </div>
    <button class="logout-btn" onclick="triggerLogout()"><i class="fa-solid fa-power-off"></i></button>
  </div>

  <!-- 👑 1. सुपर एडमिन सेक्शन -->
  <div class="admin-section" id="adminPanel">
    <div class="section-title"><i class="fa-solid fa-shield-halved"></i> J.R.D. सुपर एडमिन कंट्रोल रूम</div>
    
    <div class="grid-container">
      <div class="card admin-border">
        <h4 style="margin-bottom: 12px; font-size: 14px; color: var(--orange-main);">👥 शिक्षक उपस्थिति एवं इतिहास</h4>
        <div id="teachersListContainer"></div>
      </div>

      <div class="card admin-border">
        <h4 style="margin-bottom: 12px; font-size: 14px; color: var(--orange-main);">📩 पेंडिंग छुट्टी की अर्जियां (Leave Requests)</h4>
        <div id="leaveRequestsContainer"></div>
      </div>
    </div>

    <!-- 🏫 एडमिन अटेंडेंस टेकओवर (अपडेटेड क्लास लिस्ट) -->
    <div class="section-title"><i class="fa-solid fa-chalkboard-user"></i> किसी भी क्लास की हाजिरी खुद लें (Takeover)</div>
    <select class="class-selector" id="adminClassSelect" onchange="adminLoadClassAttendance()">
      <option value="">-- क्लास चुनें --</option>
      <option value="LKG">LKG</option>
      <option value="UKG">UKG</option>
      <option value="1st">Class 1</option>
      <option value="2nd">Class 2</option>
      <option value="3rd">Class 3</option>
      <option value="4th">Class 4</option>
      <option value="5th">Class 5</option>
      <option value="6th">Class 6</option>
      <option value="7th">Class 7</option>
      <option value="8th">Class 8</option>
      <option value="9th">Class 9</option>
      <option value="10th">Class 10</option>
      <option value="11th_ART">Class 11 (Art)</option>
      <option value="11th_SCI">Class 11 (Science)</option>
      <option value="12th_ART">Class 12 (Art)</option>
      <option value="12th_SCI">Class 12 (Science)</option>
    </select>
  </div>

  <!-- 📝 2. छात्र अटेंडेंस सेक्शन -->
  <div class="teacher-section" id="attendancePanel">
    <div class="section-title" id="attendanceTitle"><i class="fa-solid fa-list-check"></i> छात्र उपस्थिति रजिस्टर</div>
    <div id="studentsContainer" style="margin-bottom: 80px;"></div>
  </div>

  <!-- 💾 नीचे का फिक्स सेव बटन -->
  <div class="save-bar" id="saveBar" style="display: none;">
    <button class="main-save-btn" onclick="submitAttendanceData()">डेटा ओवरराइड और सेव करें ➔</button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() { loadDashboardData(); });

    let globalRole = "";

    function loadDashboardData() {
      fetch('/get_session_info')
        .then(res => res.json())
        .then(data => {
          if(data.status === "error") { window.location.href = "/"; return; }
          globalRole = data.role;
          document.getElementById("profileName").innerText = data.name + " सर";
          
          if(data.role === "ADMIN") {
            document.getElementById("profileRole").innerText = "👑 रोल: सुपर एडमिन";
            document.getElementById("profileRole").style.color = "var(--orange-main)";
            document.getElementById("adminPanel").style.display = "block";
            loadAdminFeatures();
          } else {
            document.getElementById("profileRole").innerText = "📝 क्लास टीचर: " + data.assigned_class;
            document.getElementById("attendancePanel").style.display = "block";
            document.getElementById("saveBar").style.display = "block";
            loadStudentRegister(data.assigned_class);
          }
        });
    }

    function loadAdminFeatures() {
      fetch('/admin/get_teachers')
        .then(res => res.json())
        .then(data => {
          let container = document.getElementById("teachersListContainer");
          container.innerHTML = "";
          data.teachers.forEach(t => {
            container.innerHTML += `
              <div class="teacher-item" onclick="alert('${t.name} सर का इतिहास लोड हो रहा है...')">
                <div class="teacher-meta"><h4>${t.name}</h4><p>क्लास: ${t.class}</p></div>
                <span style="font-size: 12px; font-weight:bold; color: var(--blue-main);"><i class="fa-solid fa-calendar-days"></i> देखें</span>
              </div>`;
          });
        });

      fetch('/admin/get_leaves')
        .then(res => res.json())
        .then(data => {
          let container = document.getElementById("leaveRequestsContainer");
          container.innerHTML = "";
          if(data.leaves.length === 0) container.innerHTML = "<p style='font-size:12px; color:var(--text-muted);'>कोई पेंडिंग अर्जी नहीं है।</p>";
          data.leaves.forEach(l => {
            container.innerHTML += `
              <div class="leave-item">
                <div class="leave-header"><span>${l.name}</span><span style="color:var(--orange-main);">${l.date}</span></div>
                <div class="leave-reason">कारण: ${l.reason}</div>
                <div class="leave-actions">
                  <button class="action-btn btn-approve" onclick="approveLeave('${l.name}', '${l.date}')">APPROVE</button>
                  <button class="action-btn btn-reject" onclick="alert('अस्वीकार किया गया')">REJECT</button>
                </div>
              </div>`;
          });
        });
    }

    function loadStudentRegister(className) {
      document.getElementById("attendanceTitle").innerHTML = `<i class="fa-solid fa-list-check"></i> छात्र उपस्थिति रजिस्टर - क्लास (${className.replace('_', ' ')})`;
      fetch(`/get_students?class=${className}`)
        .then(res => res.json())
        .then(data => {
          let container = document.getElementById("studentsContainer");
          container.innerHTML = "";
          data.students.forEach(s => {
            container.innerHTML += `
              <div class="student-row" data-name="${s.student_name}">
                <div class="student-info"><h4>${s.student_name}</h4><p>पिता: ${s.father_name} | मो: ${s.mobile || 'नहीं है'}</p></div>
                <div class="status-group">
                  <button class="status-btn present ${s.status === 'PRESENT' ? 'active' : ''}" onclick="toggleStatus(this, 'PRESENT')">P</button>
                  <button class="status-btn absent ${s.status === 'ABSENT' ? 'active' : ''}" onclick="toggleStatus(this, 'ABSENT')">A</button>
                </div>
              </div>`;
          });
        });
    }

    function adminLoadClassAttendance() {
      let selectedClass = document.getElementById("adminClassSelect").value;
      if(selectedClass) {
        document.getElementById("attendancePanel").style.display = "block";
        document.getElementById("saveBar").style.display = "block";
        loadStudentRegister(selectedClass);
      } else {
        document.getElementById("attendancePanel").style.display = "none";
        document.getElementById("saveBar").style.display = "none";
      }
    }

    function toggleStatus(btn, status) {
      let group = btn.parentElement;
      group.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function submitAttendanceData() {
      let rows = document.querySelectorAll(".student-row");
      let records = [];
      rows.forEach(row => {
        let name = row.getAttribute("data-name");
        let activeBtn = row.querySelector(".status-btn.active");
        let status = activeBtn ? (activeBtn.classList.contains("present") ? "PRESENT" : "ABSENT") : "ABSENT";
        records.push({ student_name: name, status: status });
      });

      fetch('/save_student_attendance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ records: records })
      }).then(res => res.json()).then(data => { alert(data.message); });
    }

    function approveLeave(name, date) {
      fetch('/admin/approve_leave', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, date: date })
      }).then(() => { alert("अर्जी मंजूर!"); loadAdminFeatures(); });
    }

    function triggerLogout() { fetch('/logout').then(() => { window.location.href = "/"; }); }
  </script>
</body>
</html>
